<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora em JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .calculadora {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 280px;
        }
        h3 { margin-top: 0; text-align: center; color: #333; }
        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 12px 0;
        }
        button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover { background-color: #0056b3; }
        #resultado {
            font-weight: bold;
            margin-top: 15px;
            color: #222;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="calculadora">
    <h3>Calculadora Visual</h3>
    <input type="number" id="num1" placeholder="Primeiro número">
    <input type="number" id="num2" placeholder="Segundo número">

    <div class="botoes">
        <button onclick="calcular('+')">+</button>
        <button onclick="calcular('-')">-</button>
        <button onclick="calcular('*')">*</button>
        <button onclick="calcular('/')">/</button>
    </div>

    <div id="resultado">Resultado: </div>
</div>

<script>
function calcular(operacao) {
    const n1 = parseFloat(document.getElementById('num1').value);
    const n2 = parseFloat(document.getElementById('num2').value);
    const labelResultado = document.getElementById('resultado');

    if (isNaN(n1) || isNaN(n2)) {
        labelResultado.innerText = "Erro: Digite números válidos!";
        return;
    }

    let res = 0;
    switch (operacao) {
        case '+': res = n1 + n2; break;
        case '-': res = n1 - n2; break;
        case '*': res = n1 * n2; break;
        case '/':
            if (n2 === 0) {
                labelResultado.innerText = "Erro: Divisão por zero!";
                return;
            }
            res = n1 / n2;
            break;
    }

    labelResultado.innerText = `Resultado: ${Number(res.toFixed(2))}`;
}
</script>

</body>
</html>
